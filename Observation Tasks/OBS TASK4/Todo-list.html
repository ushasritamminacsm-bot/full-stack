<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 10px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 40px;
        }

        .input-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 35px;
        }

        #taskInput {
            width: 330px;
            padding: 14px;
            font-size: 20px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 16px;
            font-size: 20px;
            cursor: pointer;
        }

        #taskList {
            width: 600px;
            margin: auto;
        }

        .task {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 28px 0;
            font-size: 24px;
        }

        .task-text {
            min-width: 200px;
            text-align: right;
        }

        .completed {
            text-decoration: line-through;
        }
    </style>
</head>

<body>

    <h1>My To-Do List</h1>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button onclick="addTask()">Add Task</button>
    </div>

    <div id="taskList">

        <div class="task">
            <span class="task-text">lab record</span>
            <button onclick="completeTask(this)">Complete</button>
            <button onclick="deleteTask(this)">Delete</button>
        </div>

        <div class="task">
            <span class="task-text">assignment</span>
            <button onclick="completeTask(this)">Complete</button>
            <button onclick="deleteTask(this)">Delete</button>
        </div>

        <div class="task">
            <span class="task-text">coding pratice</span>
            <button onclick="completeTask(this)">Complete</button>
            <button onclick="deleteTask(this)">Delete</button>
        </div>

        <div class="task">
            <span class="task-text">practice code tantra problems</span>
            <button onclick="completeTask(this)">Complete</button>
            <button onclick="deleteTask(this)">Delete</button>
        </div>

    </div>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let taskText = input.value.trim();

            if (taskText === "") {
                alert("Please enter a task!");
                return;
            }

            let task = document.createElement("div");
            task.className = "task";

            task.innerHTML = `
                <span class="task-text">${taskText}</span>
                <button onclick="completeTask(this)">Complete</button>
                <button onclick="deleteTask(this)">Delete</button>
            `;

            document.getElementById("taskList").appendChild(task);

            input.value = "";
        }

        function completeTask(button) {
            let task = button.parentElement;
            let text = task.querySelector(".task-text");

            text.classList.toggle("completed");
        }

        function deleteTask(button) {
            let task = button.parentElement;
            task.remove();
        }
    </script>

</body>
</html>
